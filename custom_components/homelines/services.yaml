activate_dayflat:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
    booked_at:
      selector: { datetime: {} }
restrict:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
set_group:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
    kind:
      required: true
      default: device
      selector: { select: { options: [device, network] } }
    targets:
      required: true
      selector: { text: { multiple: true } }
    group:
      required: true
      selector: { select: { options: [always, dayflat, never, inherit], translation_key: group_inherit } }
reset_usage:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
    start_balance:
      selector: { number: { min: 0, max: 1000, step: 0.01, unit_of_measurement: "€", mode: box } }
reconnect:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
test_notify:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
set_details:
  fields:
    entry_id:
      selector: { config_entry: { integration: homelines } }
    line_names:
      example: '{"WAN1": "Glasfaser", "WAN2": "DSL", "WAN3": "5G Backup"}'
      selector: { object: {} }
    lines:
      example: '{"WAN2": {"values": ["sensor.modem_dsl_sync"], "history": ["sensor.modem_dsl_sync"]}}'
      selector: { object: {} }
    speed_download:
      selector: { entity: { domain: sensor } }
    speed_upload:
      selector: { entity: { domain: sensor } }
    speed_extra:
      selector: { entity: { multiple: true } }
    backup_extra:
      selector: { entity: { multiple: true } }
    replace:
      default: false
      selector: { boolean: {} }
